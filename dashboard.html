<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - لوحة التحكم</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #243247;
        }

        header {
            background: #1769d2;
            color: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        button {
            border: 0;
            border-radius: 7px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 15px;
        }

        #logout {
            background: white;
            color: #1769d2;
        }

        main {
            width: min(900px, 92%);
            margin: 40px auto;
        }

        .welcome,
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 14px #0000000d;
            margin-bottom: 22px;
        }

        .welcome h2 {
            color: #1769d2;
            margin-top: 0;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 18px;
        }

        .card h3 {
            margin-top: 0;
            color: #1769d2;
        }

        .muted {
            color: #69778b;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <header>
        <h1>لوحة التحكم</h1>
        <button id="logout" type="button">تسجيل الخروج</button>
    </header>

    <main>

        <section class="welcome">
            <h2 id="welcomeMessage">أهلًا بيك!</h2>
            <p class="muted">
                تم فتح لوحة التحكم. من هنا تقدر تتابع بيانات حسابك.
            </p>
        </section>

        <section class="cards">

            <div class="card">
                <h3>بيانات الحساب</h3>

                <p id="userName">الاسم: —</p>

                <p id="userEmail">البريد الإلكتروني: —</p>

                <p id="userType">نوع الحساب: —</p>
            </div>

            <div class="card">
                <h3>إدارة البيانات</h3>

                <p class="muted">
                    يمكن تطوير هذا القسم لإدارة بيانات المستخدمين والملف الشخصي.
                </p>
            </div>

        </section>

    </main>

    <script>

        // Get logged-in user data
        const userData = sessionStorage.getItem("loggedInUser");

        if (!userData) {

            // Redirect to login if user is not logged in
            window.location.replace("/login.html");

        } else {

            try {

                const user = JSON.parse(userData);

                // Display welcome message
                document.getElementById("welcomeMessage").textContent =
                    "أهلًا بيك يا " + (user.name || "مستخدم") + "!";

                // Display user name
                document.getElementById("userName").textContent =
                    "الاسم: " + (user.name || "—");

                // Display user email
                document.getElementById("userEmail").textContent =
                    "البريد الإلكتروني: " + (user.email || "—");

                // Display user type
                document.getElementById("userType").textContent =
                    "نوع الحساب: " + (user.user_type || "—");

            } catch (error) {

                sessionStorage.removeItem("loggedInUser");

                window.location.replace("/login.html");

            }
        }

        // Logout
        document.getElementById("logout").addEventListener("click", () => {

            sessionStorage.removeItem("loggedInUser");

            window.location.replace("/login.html");

        });

    </script>

</body>
</html>
